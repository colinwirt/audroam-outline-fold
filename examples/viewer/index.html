<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Outline | Map · @audroam/outline-fold</title>
<!--
  Shared Pages viewer: ?doc=<md url> [&layout=<sidecar json>]
  Uses examples/_shared parseDoc → createOutlineView → createMapView.
  Layout: query layout= wins, else frontmatter layoutSidecar: / sibling *.layout.json,
  else auto-pack (empty nodes).
-->
<link rel="stylesheet" href="../../dist/outline-fold.css"/>
<link rel="stylesheet" href="./viewer.css"/>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="gold-rule" aria-hidden="true"></div>
    <div class="title-row">
      <h1 id="pageTitle">Outline | Map</h1>
      <p class="build-meta" id="buildMeta" aria-label="Build versions"></p>
    </div>
    <p class="sub" id="pageSub" hidden></p>
    <p class="banner" id="banner" hidden></p>
  </header>

  <div class="bar">
    <div class="seg" role="group" aria-label="View mode">
      <button type="button" id="btnOutline" aria-pressed="true">Outline</button>
      <button type="button" id="btnMap" aria-pressed="false">Map</button>
    </div>
    <details class="keys">
      <summary>Keys</summary>
      <p>
        Outline: <kbd>↑</kbd><kbd>↓</kbd> row · <kbd>←</kbd><kbd>→</kbd> fold/parent ·
        <kbd>.</kbd>/<kbd>Space</kbd> toggle · <kbd>0</kbd>–<kbd>9</kbd> levels.
        Map: <kbd>↑</kbd><kbd>↓</kbd> siblings · <kbd>→</kbd> child · <kbd>←</kbd> parent ·
        <kbd>.</kbd>/<kbd>Space</kbd> fold · <kbd>0</kbd>–<kbd>9</kbd> when selected.
        Wheel, drag, and pinch pan and zoom. Session-local.
      </p>
    </details>
  </div>

  <div id="loadErr" class="err" hidden></div>
  <div id="validation" class="validation" hidden></div>

  <div id="panel" class="tile" data-mode="outline">
    <div id="outlineHost"></div>
    <div id="mapHost" class="map-wrap" hidden></div>
    <div class="map-tools of-map-controls" id="mapTools" hidden>
      <button type="button" id="btnZoomOut" title="Zoom out" aria-label="Zoom out">−</button>
      <button type="button" id="btnZoomIn" title="Zoom in" aria-label="Zoom in">+</button>
      <button type="button" id="btnResetView" title="Fit the outline in the window" aria-label="Fit">Fit</button>
    </div>
  </div>

  <details class="serialize" id="serializeBox">
    <summary>Handoff text</summary>
    <pre id="foldOut"></pre>
  </details>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
