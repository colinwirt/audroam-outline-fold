<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Northside Corner Cafe — 3D ops map</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0b0f; color: #eee; font-family: system-ui, sans-serif; }
    #hud { position: absolute; left: 12px; top: 12px; z-index: 2; max-width: 420px; }
    #hud h1 { font-size: 1.25rem; }
    #hud button { font: inherit; }
    canvas { display: block; }
    code { color: #C9A227; }
    .labels { position: absolute; inset: 0; pointer-events: none; }
    .label {
      box-sizing: border-box; max-width: var(--label-w, 120px);
      padding: 2px 6px; border-radius: 4px;
      background: rgba(11, 11, 15, 0.8); color: #eee;
      font: 12px/1.3 system-ui, sans-serif; text-align: center;
    }
    .label .state { display: block; color: #C9A227; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="hud">
    <h1>☕ Northside Corner Cafe — 3D ops map</h1>
    <p>Click a sphere to fold or unfold it.</p>
    <p id="demoUnlock" hidden>
      <button type="button" id="btnUnlockAll">Unlock</button>
      Demo password: <code id="demoPw"></code>
    </p>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
